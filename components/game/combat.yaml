# AskeeDS — game/combat
# Pyglet-only pane components for combat display.

combat-card.enemy:
  category: game/
  description: Combat card showing enemy name and Flesh bar for the Pyglet renderer.
  status: in-progress
  font_size: small
  props:
    enemy_name:
      type: string
      required: true
    enemy_flesh:
      type: integer
      required: true
    enemy_flesh_max:
      type: integer
      required: true
    bar_label:
      type: string
      required: false
  render:
    type: inline
    template: "{enemy_name} {enemy_flesh}/{enemy_flesh_max}"
  notes: >-
    Pyglet-only component. All drawing is handled by _draw_combat_card_enemy()
    in pyglet_renderer.py.

combat-card.actions:
  category: game/
  description: Combat card showing player Flesh bar and round counter for the Pyglet renderer.
  status: in-progress
  font_size: small
  props:
    player_flesh:
      type: integer
      required: true
    player_flesh_max:
      type: integer
      required: true
    round:
      type: integer
      required: true
    bar_label:
      type: string
      required: false
  render:
    type: inline
    template: "Flesh {player_flesh}/{player_flesh_max} Round {round}"
  notes: >-
    Pyglet-only component. All drawing is handled by _draw_combat_card_actions()
    in pyglet_renderer.py.
